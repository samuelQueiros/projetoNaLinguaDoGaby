# Docker Standalone: use Build method "Repository" no Portainer (Compose
# path: deploy/portainer-stack.yml). O Portainer clona o repositório e
# builda as imagens a partir dos blocos `build:` abaixo — não precisa de
# docker build manual nem de registry. Não funciona via Web editor/Upload
# (sem repositório clonado não há código-fonte para o `pull_policy: build`
# buildar) — veja deploy/PORTAINER.md para a alternativa nesse caso.
# Importe as variáveis de portainer.env.example.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${ERP_WEB_IMAGE:-erp-financeiro-web:1.0.0}
    build:
      context: ..
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Seguranca__PermitirHttpLocal: "true"
      AllowedHosts: "*"
      ConnectionStrings__DefaultConnection: 'Host=postgres;Port=5432;Database=erp_financeiro;Username=erp;Password="${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}"'
      Criptografia__ChaveAes256Base64: ${AES_KEY_BASE64:?defina AES_KEY_BASE64}
      SeedAdministrador__Email: ${ADMIN_EMAIL:?defina ADMIN_EMAIL}
      SeedAdministrador__SenhaInicial: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD}
      Banco__AplicarMigracoes: "true"
      Anexos__RaizFisica: /app/storage
      DataProtection__DiretorioChaves: /app/keys
      Ia__Leitor__Modo: Http
      Ia__Leitor__BaseUrl: http://servico-documentos:8000
      Ia__Leitor__TokenInterno: ${INTERNAL_TOKEN:?defina INTERNAL_TOKEN}
      Ia__Leitor__TimeoutSegundos: "240"
    ports:
      - "${ERP_BIND_IP:-127.0.0.1}:${ERP_PORT:-8080}:8080"
    volumes:
      - anexos:/app/storage
      - chaves:/app/keys
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      servico-documentos:
        condition: service_healthy
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_DB: erp_financeiro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  servico-documentos:
    image: ${ERP_DOCUMENTOS_IMAGE:-erp-financeiro-documentos:1.0.0}
    build: ../servico-documentos
    pull_policy: build
    restart: unless-stopped
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?defina INTERNAL_TOKEN}
      LLM_PROVIDER: none
      OCR_HABILITADO: "true"
      OCR_IDIOMA: por+eng
      MAX_ARQUIVO_MB: "25"
      LOG_LEVEL: INFO
      LOG_TEXTO_BRUTO: "false"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

networks:
  # Sem portas publicadas; permite saída para os provedores de IA.
  backend:

volumes:
  postgres_data:
  anexos:
  chaves:
