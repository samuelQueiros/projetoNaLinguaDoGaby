# Docker Standalone. Consulte deploy/PORTAINER.md e importe as variáveis de
# portainer.env.example. Pode ser implantado de duas formas:
#   - Repository: o Portainer clona o repositório e builda as imagens local-
#     mente a partir dos blocos `build:` abaixo (nenhum docker build manual).
#   - Web editor: cole este arquivo e construa as imagens manualmente antes
#     (docker build ...) — os blocos `build:` continuam funcionando também
#     nesse caminho, mas só valem se o contexto (pasta com ErpFinanceiro.sln)
#     estiver disponível onde o Docker builda, o que só ocorre via Repository.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${ERP_WEB_IMAGE:-erp-financeiro-web:1.0.0}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Seguranca__PermitirHttpLocal: "true"
      AllowedHosts: "*"
      ConnectionStrings__DefaultConnection: 'Host=postgres;Port=5432;Database=erp_financeiro;Username=erp;Password="${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}"'
      Criptografia__ChaveAes256Base64: ${AES_KEY_BASE64:?defina AES_KEY_BASE64}
      SeedAdministrador__Email: ${ADMIN_EMAIL:?defina ADMIN_EMAIL}
      SeedAdministrador__SenhaInicial: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD}
      Banco__AplicarMigracoes: "true"
      Anexos__RaizFisica: /app/storage
      DataProtection__DiretorioChaves: /app/keys
      Ia__Leitor__Modo: Http
      Ia__Leitor__BaseUrl: http://servico-documentos:8000
      Ia__Leitor__TokenInterno: ${INTERNAL_TOKEN:?defina INTERNAL_TOKEN}
      Ia__Leitor__TimeoutSegundos: "240"
    ports:
      - "${ERP_BIND_IP:-127.0.0.1}:${ERP_PORT:-8080}:8080"
    volumes:
      - anexos:/app/storage
      - chaves:/app/keys
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      servico-documentos:
        condition: service_healthy
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_DB: erp_financeiro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  servico-documentos:
    image: ${ERP_DOCUMENTOS_IMAGE:-erp-financeiro-documentos:1.0.0}
    build: ../servico-documentos
    restart: unless-stopped
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?defina INTERNAL_TOKEN}
      LLM_PROVIDER: none
      OCR_HABILITADO: "true"
      OCR_IDIOMA: por+eng
      MAX_ARQUIVO_MB: "25"
      LOG_LEVEL: INFO
      LOG_TEXTO_BRUTO: "false"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

networks:
  # Sem portas publicadas; permite saída para os provedores de IA.
  backend:

volumes:
  postgres_data:
  anexos:
  chaves:
