services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-financeiro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env (veja .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-erp_financeiro}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp_financeiro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  servico-documentos:
    build: ./backend/servico-documentos
    container_name: erp-servico-documentos
    restart: unless-stopped
    env_file: ./backend/servico-documentos/.env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: backend/src/ErpFinanceiro.Web/Dockerfile
    container_name: erp-financeiro-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      servico-documentos:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-erp_financeiro};Username=${POSTGRES_USER:-erp};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env (veja .env.example)}"
      # Habilitado aqui pois esta stack local roda uma única instância do web.
      Banco__AplicarMigracoes: "true"
      Criptografia__ChaveAes256Base64: ${CRIPTOGRAFIA_CHAVE_AES256_BASE64:?defina CRIPTOGRAFIA_CHAVE_AES256_BASE64 no arquivo .env (veja .env.example)}
      SeedAdministrador__Nome: ${ADMIN_NOME:-Administrador}
      SeedAdministrador__Email: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no arquivo .env}
      SeedAdministrador__SenhaInicial: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no arquivo .env}
      Ia__Leitor__Modo: ${IA_LEITOR_MODO:-Stub}
      # Acesso por HTTP pela rede (ex.: http://chat-server:8080) — sem isso o
      # cookie de login sai com a flag Secure e o navegador o descarta.
      Seguranca__PermitirHttpLocal: ${PERMITIR_HTTP_LOCAL:-true}
      Ia__Leitor__BaseUrl: http://servico-documentos:8000
      Ia__Leitor__TimeoutSegundos: "120"
      Ia__Leitor__TokenInterno: ${IA_LEITOR_TOKEN_INTERNO:-}
      Ia__Chat__Provedor: ${CHAT_IA_PROVEDOR:-}
      Ia__Chat__Modelo: ${CHAT_IA_MODELO:-}
      Ia__Chat__ApiKey: ${CHAT_IA_API_KEY:-}
      Ia__Documentos__Provedor: ${DOCUMENTOS_IA_PROVEDOR:-}
      Ia__Documentos__Modelo: ${DOCUMENTOS_IA_MODELO:-}
      Ia__Documentos__ApiKey: ${DOCUMENTOS_IA_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  erp_postgres_data:
    name: erp_financeiro_postgres_data
